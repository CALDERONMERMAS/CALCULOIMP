<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Esta línea asegura que se adapte perfecto a pantallas de celular sin deformarse -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora Flexo</title>
    <style>
        :root {
            --primary: #0284c7; /* Azul industrial */
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background: var(--card);
            width: 100%;
            max-width: 400px; /* Tamaño ideal para móvil */
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 24px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.4rem;
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
            color: #0f172a;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1.1rem;
            box-sizing: border-box;
            background-color: #f8fafc;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
        }
        .btn {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 4px 6px rgba(2, 132, 199, 0.2);
        }
        .btn:active {
            background-color: #0369a1;
            transform: translateY(1px);
        }
        .btn-clear {
            background-color: #e2e8f0;
            color: #475569;
            margin-top: 12px;
            box-shadow: none;
        }
        .btn-clear:active {
            background-color: #cbd5e1;
        }
        .result-box {
            margin-top: 24px;
            text-align: center;
            padding: 20px;
            background-color: #f0f9ff;
            border-radius: 8px;
            border: 2px dashed #bae6fd;
        }
        .result-title {
            font-size: 1rem;
            color: #0369a1;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .result-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #0c4a6e;
            word-break: break-word;
        }
        .paso-texto {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Calculadora de Piezas</h1>

        <div class="form-group">
            <label for="dientes">1. Dientes del Engrane (Z)</label>
            <input type="number" id="dientes" inputmode="numeric" placeholder="Ej. 80">
            <div class="paso-texto">Paso: 3.175 mm (1/8 CP)</div>
        </div>

        <div class="form-group">
            <label for="repEje">2. Repeticiones al Eje (Ancho)</label>
            <input type="number" id="repEje" inputmode="numeric" placeholder="Ej. 4">
        </div>

        <div class="form-group">
            <label for="repDesarrollo">3. Repeticiones al Desarrollo</label>
            <input type="number" id="repDesarrollo" inputmode="numeric" placeholder="Ej. 2">
        </div>

        <div class="form-group">
            <label for="metros">4. Longitud de Bobina (Metros)</label>
            <input type="number" id="metros" inputmode="decimal" step="0.01" placeholder="Ej. 3500">
        </div>

        <button class="btn" onclick="calcular()">Calcular Piezas</button>
        <button class="btn btn-clear" onclick="limpiar()">Limpiar Datos</button>

        <div class="result-box">
            <div class="result-title">TOTAL DE PIEZAS</div>
            <div class="result-value" id="resultado">0</div>
        </div>
    </div>

    <script>
        function calcular() {
            // Obtener valores
            let dientes = parseFloat(document.getElementById('dientes').value);
            let repEje = parseFloat(document.getElementById('repEje').value);
            let repDesarrollo = parseFloat(document.getElementById('repDesarrollo').value);
            let metros = parseFloat(document.getElementById('metros').value);

            // Validar que no falten datos
            if (!dientes || !repEje || !repDesarrollo || !metros) {
                alert("Por favor, llena todos los campos para poder calcular.");
                return;
            }

            // Desarrollo del cilindro en milímetros
            let desarrolloMm = dientes * 3.175;
            
            // Convertir desarrollo a metros
            let desarrolloMetros = desarrolloMm / 1000;

            // Piezas que salen por cada vuelta completa del cilindro
            let piezasPorVuelta = repEje * repDesarrollo;

            // Vueltas totales de la bobina
            let vueltasTotales = metros / desarrolloMetros;

            // Total de piezas (Redondeado hacia abajo para no contar piezas incompletas)
            let piezasTotales = Math.floor(vueltasTotales * piezasPorVuelta);

            // Mostrar resultado con comas para miles
            document.getElementById('resultado').innerText = piezasTotales.toLocaleString('es-MX');
        }

        function limpiar() {
            document.getElementById('dientes').value = '';
            document.getElementById('repEje').value = '';
            document.getElementById('repDesarrollo').value = '';
            document.getElementById('metros').value = '';
            document.getElementById('resultado').innerText = '0';
            
            // Regresar el foco al primer campo
            document.getElementById('dientes').focus();
        }
    </script>
</body>
</html>
